name: Convert MP4 to GIF

on:
  push:
    paths:
      - 'videos/*.mp4' # videosフォルダ内に.mp4が追加された時に起動
      - 'videos/*.mov'
      - 'videos/*.webm'

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 変換後のGIFを自動コミットするために書き込み権限を付与

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert MP4 to GIF
        run: |
          mkdir -p assets
          for file in videos/*.mp4; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .mp4)
              # 画質とサイズを適度に落として軽量なGIFを生成 (幅720px, 10fps)
              ffmpeg -i "$file" -vf "fps=10,scale=720:-1:flags=lanczos" -y "assets/${filename}.gif"
            fi
          done

      - name: Commit and Push GIF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.gif
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: convert MP4 to GIF" && git push)
